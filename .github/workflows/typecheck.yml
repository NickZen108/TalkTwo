name: QA

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm test
      - run: npm run layout:check
      - run: npm run privacy:check
      - run: npx expo-doctor
      - run: npm run audit:runtime
      - run: npx expo export --platform android --output-dir dist-qa
      - run: npx expo prebuild --platform android --no-install --clean
      - run: node scripts/check-android-permissions.mjs
      - run: cd android && ./gradlew assembleRelease --no-daemon
      - run: node scripts/check-android-permissions.mjs --merged --release
      - uses: actions/upload-artifact@v4
        with:
          name: talktwo-qa-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  ios-prebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx expo export --platform ios --output-dir dist-ios-qa
      - run: npx expo prebuild --platform ios --no-install --clean
      - run: npm run ios:check
