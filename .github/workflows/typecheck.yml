name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm test
      - run: npx expo-doctor
      - run: npm run audit:runtime
      - run: npx expo export --platform android --output-dir dist-qa
      - run: npx expo prebuild --platform android --no-install --clean
      - run: node scripts/check-android-permissions.mjs
